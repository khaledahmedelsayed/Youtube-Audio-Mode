<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earmode</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main class="popup">
        <header class="bar">
            <div class="brand">
                <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
                    <rect width="32" height="32" rx="9" fill="#1C1B22" />
                    <path d="M10 19v-3a6 6 0 0 1 12 0v3" fill="none" stroke="currentColor" stroke-width="2.6"
                        stroke-linecap="round" />
                    <rect x="8" y="18" width="4.5" height="7" rx="2" fill="currentColor" />
                    <rect x="19.5" y="18" width="4.5" height="7" rx="2" fill="currentColor" />
                </svg>
                <span>Earmode</span>
            </div>
            <button type="button" class="icon-btn lang-btn" id="lang-btn">ع</button>
            <button type="button" class="icon-btn" id="gear-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    aria-hidden="true">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
                </svg>
            </button>
        </header>

        <div class="switch" id="switch" role="group" data-i18n-aria-label="switchLabel" data-on="false" data-disabled="true">
            <span class="knob" aria-hidden="true"></span>
            <button type="button" class="opt-video" id="switch-video" data-audio="false" aria-pressed="false" disabled>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
                <b data-i18n="switchVideo">Video</b>
                <small data-i18n="switchVideoSub">Full picture</small>
            </button>
            <button type="button" class="opt-audio" id="switch-audio" data-audio="true" aria-pressed="false" disabled>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M4 15v-3a8 8 0 0 1 16 0v3" />
                    <rect x="3" y="14" width="5" height="7" rx="2" />
                    <rect x="16" y="14" width="5" height="7" rx="2" />
                </svg>
                <b data-i18n="switchAudio">Audio</b>
                <small data-i18n="switchAudioSub">144p, saves data</small>
            </button>
        </div>

        <div class="state" id="state" aria-live="polite">
            <span class="pill" id="state-pill" hidden></span>
            <span id="state-text"></span>
            <button type="button" id="back-to-auto" data-i18n="backToAuto" hidden>Back to auto</button>
        </div>

        <div class="channel" id="channel" hidden>
            <div class="avatar" id="channel-avatar" aria-hidden="true"></div>
            <div class="who"><b id="channel-name"></b></div>
            <button type="button" class="add" id="channel-add" data-in="false" aria-pressed="false"></button>
        </div>

        <section class="block">
            <span class="title" id="auto-label" data-i18n="autoListenLabel">Auto-listen for new videos</span>
            <div class="seg" id="mode-seg" role="group" aria-labelledby="auto-label">
                <button type="button" data-mode="always" data-i18n="modeEverything" aria-pressed="false">Everything</button>
                <button type="button" data-mode="filtered" data-i18n="modeMyList" aria-pressed="false">My list</button>
                <button type="button" data-mode="off" data-i18n="modeNothing" aria-pressed="false">Nothing</button>
            </div>
            <span class="hint" id="mode-hint"></span>
            <button type="button" class="list-toggle" id="list-toggle" aria-expanded="false"
                aria-controls="list-panel"></button>
            <div class="list-panel" id="list-panel" hidden>
                <div class="list-group">
                    <span class="list-title" id="list-channels-title" data-i18n="channels">Channels</span>
                    <ul class="list-rows" id="list-channels" aria-labelledby="list-channels-title"></ul>
                    <p class="list-empty" id="list-channels-empty" data-i18n="popupNoChannels" hidden></p>
                </div>
                <div class="list-group">
                    <span class="list-title" id="list-keywords-title" data-i18n="keywords">Keywords</span>
                    <ul class="list-rows" id="list-keywords" aria-labelledby="list-keywords-title"></ul>
                    <p class="list-empty" id="list-keywords-empty" data-i18n="noKeywords" hidden></p>
                    <div class="list-add">
                        <input type="text" id="keyword-input" maxlength="100" autocomplete="off"
                            data-i18n-placeholder="enterKeyword" data-i18n-aria-label="addKeyword">
                        <button type="button" id="keyword-add" data-i18n="add">Add</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="block">
            <span class="title" id="look-label" data-i18n="playerLookLabel">Player look while listening</span>
            <div class="looks" id="looks" role="group" aria-labelledby="look-label">
                <button type="button" class="look" data-look="card" aria-pressed="false">
                    <span class="sw sw-card" aria-hidden="true"></span><span data-i18n="lookCard">Card</span>
                </button>
                <button type="button" class="look" data-look="blur" aria-pressed="false">
                    <span class="sw sw-blur" aria-hidden="true"></span><span data-i18n="lookBlur">Blur</span>
                </button>
                <button type="button" class="look" data-look="minimal" aria-pressed="false">
                    <span class="sw sw-minimal" aria-hidden="true"></span><span data-i18n="lookSimple">Simple</span>
                </button>
                <button type="button" class="look" data-look="waves" aria-pressed="false">
                    <span class="sw sw-waves" aria-hidden="true"></span><span data-i18n="lookWaves">Waves</span>
                </button>
            </div>
        </section>

        <footer class="stats">
            <span id="stats-text"></span>
            <button type="button" class="stats-link" id="stats" data-i18n="statsLink">Stats</button>
        </footer>
    </main>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
</body>

</html>
